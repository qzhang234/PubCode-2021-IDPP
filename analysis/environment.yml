# Conda environment for reproducing every PDF figure in this directory.
#
#   conda env create -f environment.yml     # creates env-2021-LLDP
#   conda activate env-2021-LLDP
#   make -C .. figures                      # or: cd SAXS_12id && python Plot_12ID.py
#
# Only the five scientific packages below are needed by the figure scripts.
# `pyxpcsviewer` is NOT required: it is imported lazily inside
# common/utils.py helpers (read_keys_from_files, process_group,
# process_group_by_range) that operate on raw beamline files and are not on
# the path from the reduced data in this repo to any figure.
name: env-2021-LLDP
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.*
  - scipy=1.11.*
  # 3.9.4 exactly: the committed figure PDFs were produced with it, and
  # matplotlib's tight-bbox metrics shift by ~0.01 in between minor releases,
  # which changes every figure's page size. Pinned so reruns are byte-stable.
  - matplotlib-base=3.9.4
  - h5py=3.10.*
  - pandas=2.1.*
