# Conda environment for every figure and number script in this repository.
#
#   conda env create -f environment.yml     # creates env-2021-LLDP
#   make -C .. figures
#
# The beamline-side scripts that produced data_2021-3/ need more than this
# (nexus_xpcs_aps, the pySimpleMask source, boost_corr); see the root README.
name: env-2021-LLDP
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.*
  - scipy=1.11.*
  # 3.9.4 exactly: the committed figures were drawn with it, and tight_layout's
  # spacing shifts slightly between releases, which moves axes and keys.
  - matplotlib-base=3.9.4
  - h5py=3.10.*
  - pandas=2.1.*
